services:
  - type: web
    name: lifeops-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: LIFEOPS_PAYTO
        sync: false
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET_KEY
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: LIFEOPS_DEMO_MODE
        value: "false"
      - key: LIFEOPS_PREVIEW_ENABLED
        value: "true"
      - key: LIFEOPS_CORS_ORIGINS
        sync: false

  - type: web
    name: lifeops-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        sync: false
